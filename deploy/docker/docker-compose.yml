services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simulationdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__simulationdb: Host=postgres;Port=5432;Database=simulationdb;Username=postgres;Password=postgres
      ConnectionStrings__rabbitmq: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - postgres
      - rabbitmq
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.Dockerfile
    depends_on:
      - api
    ports:
      - "4173:80"

volumes:
  postgres-data:
